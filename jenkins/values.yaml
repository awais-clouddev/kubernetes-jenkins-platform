controller:
  numExecutors: 0

  initContainerEnv:
    - name: JAVA_TOOL_OPTIONS
      value: "-Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false"

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "3Gi"

  installPlugins:
    - kubernetes:4538.v5b_ce7f35b_257
    - workflow-aggregator:608.v67378e9d3db_1
    - git:5.10.1
    - configuration-as-code:2103.vd6f93c3e714a_
    - prometheus:860.v532442b_44e9a_
    - job-dsl:3732.v9a_c49a_61a_313

  installLatestPlugins: false

  JCasC:
    defaultConfig: true
    configScripts:
      project-config: |
        jenkins:
          systemMessage: "Kubernetes Jenkins Platform"

persistence:
  enabled: true
  storageClass: standard
  size: 8Gi

serviceAccount:
  create: true
  name: jenkins-controller

agent:
  namespace: ci-build-agents
  jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
  jenkinsTunnel: "jenkins-agent.jenkins.svc.cluster.local:50000"
  podName: "build-agent"
  serviceAccount: "jenkins-build-agent"
  customJenkinsLabels:
    - "k8s-build-agent"
  nodeSelector:
    workload: ci
  yamlTemplate: |-
    apiVersion: v1
    kind: Pod
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jnlp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: python
          image: python:3.13-slim
          command:
            - sh
            - -c
            - sleep 86400
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: trivy
          image: ghcr.io/aquasecurity/trivy:0.74.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - sleep 86400
          env:
            - name: TRIVY_CACHE_DIR
              value: /tmp/trivy-cache
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: buildctl
          image: moby/buildkit:v0.33.0-rootless
          command:
            - sh
            - -c
            - sleep 86400
          env:
            - name: BUILDKIT_HOST
              value: tcp://buildkitd.buildkit-system.svc.cluster.local:1234
            - name: BUILDKIT_TLS_CACERT
              value: /certs/ca.crt
            - name: BUILDKIT_TLS_CERT
              value: /certs/tls.crt
            - name: BUILDKIT_TLS_KEY
              value: /certs/tls.key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: buildkit-client-tls
              mountPath: /certs
              readOnly: true
      volumes:
        - name: buildkit-client-tls
          secret:
            secretName: buildkit-client-tls
      tolerations:
        - key: dedicated
          operator: Equal
          value: ci
          effect: NoSchedule

additionalClouds:
  staging-deploy-cloud:
    agent:
      restrictedPssSecurityContext: true
      namespace: ci-deploy-agents
      podName: "staging-deploy-agent"
      serviceAccount: "staging-deployer"
      podRetention: "Never"
      customJenkinsLabels:
        - "k8s-staging-deploy-agent"
      nodeSelector:
        workload: ci
      yamlTemplate: |-
        apiVersion: v1
        kind: Pod
        spec:
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: deploy-tools
              image: jenkins/inbound-agent:3384.v60d89463d9e0-1
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - sleep 86400
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
          tolerations:
            - key: dedicated
              operator: Equal
              value: ci
              effect: NoSchedule

  production-deploy-cloud:
    agent:
      restrictedPssSecurityContext: true
      namespace: ci-deploy-agents
      podName: "production-deploy-agent"
      serviceAccount: "production-deployer"
      customJenkinsLabels:
        - "k8s-production-deploy-agent"
      nodeSelector:
        workload: ci
      yamlTemplate: |-
        apiVersion: v1
        kind: Pod
        spec:
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: deploy-tools
              image: jenkins/inbound-agent:3384.v60d89463d9e0-1
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - sleep 86400
              resources:
                requests:
                  cpu: "100m"
                  memory: "128Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
          tolerations:
            - key: dedicated
              operator: Equal
              value: ci
              effect: NoSchedule
