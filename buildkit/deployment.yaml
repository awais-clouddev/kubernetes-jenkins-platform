apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: buildkit-system
  labels:
    app: buildkitd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildkitd
  template:
    metadata:
      labels:
        app: buildkitd
    spec:
      serviceAccountName: buildkit
      automountServiceAccountToken: false
      nodeSelector:
        workload: ci
      tolerations:
        - key: dedicated
          operator: Equal
          value: ci
          effect: NoSchedule
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.33.0-rootless
          args:
            - --addr
            - unix:///run/user/1000/buildkit/buildkitd.sock
            - --addr
            - tcp://0.0.0.0:1234
            - --tlscacert
            - /certs/ca.crt
            - --tlscert
            - /certs/tls.crt
            - --tlskey
            - /certs/tls.key
            - --oci-worker-no-process-sandbox
          ports:
            - name: buildkit
              containerPort: 1234
          readinessProbe:
            exec:
              command:
                - buildctl
                - debug
                - workers
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - buildctl
                - debug
                - workers
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
          volumeMounts:
            - name: tls
              mountPath: /certs
              readOnly: true
            - name: buildkit-data
              mountPath: /home/user/.local/share/buildkit
      volumes:
        - name: tls
          secret:
            secretName: buildkit-server-tls
        - name: buildkit-data
          emptyDir: {}
