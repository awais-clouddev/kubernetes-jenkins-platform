{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: public.ecr.aws/docker/library/redis:7-alpine
          startupProbe:
            exec:
              command: ["sh", "-c", "[ \"$(redis-cli -h 127.0.0.1 ping)\" = PONG ]"]
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", "[ \"$(redis-cli -h 127.0.0.1 ping)\" = PONG ]"]
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "[ \"$(redis-cli -h 127.0.0.1 ping)\" = PONG ]"]
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 6
          resources:
{{ toYaml .Values.redis.resources | indent 12 }}
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
{{- end }}
