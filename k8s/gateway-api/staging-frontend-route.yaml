apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: helpdesk-staging-frontend
  namespace: helpdesk-staging
spec:
  parentRefs:
    - name: helpdesk-gateway
      namespace: envoy-gateway-system
  hostnames:
    - staging.helpdesk.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: helpdesk-frontend
          port: 80
