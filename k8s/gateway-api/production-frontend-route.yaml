apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: helpdesk-production-frontend
  namespace: helpdesk-production
spec:
  parentRefs:
    - name: helpdesk-gateway
      namespace: envoy-gateway-system
  hostnames:
    - production.helpdesk.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: helpdesk-frontend
          port: 80
