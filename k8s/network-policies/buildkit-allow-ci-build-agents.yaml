apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ci-build-agents-to-buildkit
  namespace: buildkit-system
spec:
  podSelector:
    matchLabels:
      app: buildkitd
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ci-build-agents
      ports:
        - protocol: TCP
          port: 1234
