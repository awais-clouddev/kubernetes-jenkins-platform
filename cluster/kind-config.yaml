kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kubernetes-jenkins-platform

nodes:
  - role: control-plane

  - role: worker
    labels:
      workload: application

  - role: worker
    labels:
      workload: application

  - role: worker
    labels:
      workload: ci
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            register-with-taints: "dedicated=ci:NoSchedule"
